name: animated_count
description: Tiny Flutter widgets that count a number up or down to its new value, as plain text or as odometer-style rolling digits. Accessible, no dependencies.
version: 0.4.0
repository: https://github.com/Parteicoder/animated_count
issue_tracker: https://github.com/Parteicoder/animated_count/issues
screenshots:
  - description: Three rolling-digit styles when the buttons are tapped.
    path: doc/demo.gif
topics:
  - animation
  - counter
  - text
  - widget

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
