name: animated_count
description: A tiny Flutter widget that counts an integer up or down to its new value. One plain Text, so font scaling, wrapping and screen readers just work.
version: 0.2.0
repository: https://github.com/Parteicoder/animated_count
issue_tracker: https://github.com/Parteicoder/animated_count/issues
topics:
  - animation
  - counter
  - text
  - widget

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
